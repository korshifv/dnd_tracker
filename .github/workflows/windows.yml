name: Windows Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Deploy Qt Dependencies
      run: |
        windeployqt --release --no-translations --compiler-runtime build/Release/dnd_tracker.exe

    - name: Package Release
      run: |
        mkdir dnd_tracker_windows
        copy build\Release\dnd_tracker.exe dnd_tracker_windows\
        copy styles.qss dnd_tracker_windows\
        xcopy /E /I build\Release\*.dll dnd_tracker_windows\
        xcopy /E /I build\Release\platforms dnd_tracker_windows\platforms\
        xcopy /E /I build\Release\styles dnd_tracker_windows\styles\
        powershell Compress-Archive -Path dnd_tracker_windows -DestinationPath dnd_tracker_windows.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dnd_tracker_windows
        path: dnd_tracker_windows.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dnd_tracker_windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

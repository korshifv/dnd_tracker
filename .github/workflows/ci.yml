name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  QT_REPOSITORY: 'https://download.qt.io'

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build p7zip-full curl \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Qt from official component archives
        run: |
          set -euo pipefail
          component="$QT_REPOSITORY/online/qtsdkrepository/linux_x64/desktop/qt6_683/qt6_683/qt.qt6.683.linux_gcc_64/"
          work="$RUNNER_TEMP/qt-archives"
          qt_root="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"
          mkdir -p "$work" "$qt_root"

          mapfile -t archives < <(
            curl -fsSL "$component" \
              | grep -oE 'href="[^"?]+\.7z"' \
              | cut -d'"' -f2 \
              | sort -u
          )
          if (( ${#archives[@]} == 0 )); then
            echo "No Qt archives found at $component" >&2
            exit 1
          fi

          for file in "${archives[@]}"; do
            [[ "$file" == *meta.7z ]] && continue
            archive="$work/$(basename "$file")"
            curl -fL --retry 3 --retry-delay 2 -o "$archive" "${component}${file}"
            7z x -y "$archive" -o"$qt_root" >/dev/null
          done
          find "$qt_root" -type f \( -path '*/bin/*' -o -path '*/libexec/*' \) -exec chmod +x {} +
          test -e "$qt_root/bin/qt-cmake"

          icu_file="$(find "$qt_root" \( -type f -o -type l \) -name 'libicui18n.so.73' -print -quit)"
          if [[ -z "$icu_file" ]]; then
            echo "Bundled ICU 73 was not found under $qt_root" >&2
            find "$qt_root" -maxdepth 5 -name 'libicu*.so*' -print >&2 || true
            exit 1
          fi
          icu_lib="$(dirname "$icu_file")"
          echo "LD_LIBRARY_PATH=$icu_lib:$qt_root/lib" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package smoke test
        run: cmake --install build --prefix "$RUNNER_TEMP/package"

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          choco install ninja --no-progress -y

      - name: Install Qt
        shell: pwsh
        run: |
          aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 `
            --base "$env:QT_REPOSITORY/" `
            --outputdir "$env:RUNNER_TEMP\Qt"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        shell: pwsh
        run: |
          $env:Path = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64\bin;$env:Path"
          ctest --test-dir build --output-on-failure

      - name: Package smoke test
        shell: pwsh
        run: cmake --install build --prefix "$env:RUNNER_TEMP\package"

  android:
    name: Android ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build p7zip-full curl

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018'

      - name: Install Qt host and Android kits from official archives
        run: |
          set -euo pipefail

          install_component() {
            local component="$1"
            local work="$2"
            local target="$3"
            mkdir -p "$work" "$target"
            mapfile -t archives < <(
              curl -fsSL "$component" \
                | grep -oE 'href="[^"?]+\.7z"' \
                | cut -d'"' -f2 \
                | sort -u
            )
            if (( ${#archives[@]} == 0 )); then
              echo "No Qt archives found at $component" >&2
              exit 1
            fi
            for file in "${archives[@]}"; do
              [[ "$file" == *meta.7z ]] && continue
              archive="$work/$(basename "$file")"
              curl -fL --retry 3 --retry-delay 2 -o "$archive" "${component}${file}"
              7z x -y "$archive" -o"$target" >/dev/null
            done
            find "$target" -type f \( -path '*/bin/*' -o -path '*/libexec/*' \) -exec chmod +x {} +
          }

          host_root="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"
          android_root="$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a"
          host_component="$QT_REPOSITORY/online/qtsdkrepository/linux_x64/desktop/qt6_683/qt6_683/qt.qt6.683.linux_gcc_64/"
          android_component="$QT_REPOSITORY/online/qtsdkrepository/all_os/android/qt6_683/qt6_683_arm64_v8a/qt.qt6.683.android_arm64_v8a/"
          install_component "$host_component" "$RUNNER_TEMP/qt-host" "$host_root"
          install_component "$android_component" "$RUNNER_TEMP/qt-android" "$android_root"

          test -e "$host_root/bin/qt-cmake"
          test -e "$android_root/bin/qt-cmake"

          icu_file="$(find "$host_root" \( -type f -o -type l \) -name 'libicui18n.so.73' -print -quit)"
          if [[ -z "$icu_file" ]]; then
            echo "Bundled ICU 73 was not found under $host_root" >&2
            find "$host_root" -maxdepth 5 -name 'libicu*.so*' -print >&2 || true
            exit 1
          fi
          icu_lib="$(dirname "$icu_file")"
          echo "LD_LIBRARY_PATH=$icu_lib:$host_root/lib" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          "$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a/bin/qt-cmake" \
            -S . -B build-android -G Ninja \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018" \
            -DANDROID_ABI=arm64-v8a

      - name: Build native code
        run: cmake --build build-android --parallel

      - name: Build APK
        run: cmake --build build-android --target apk --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd-tracker-android-arm64
          path: build-android/**/*.apk
          if-no-files-found: error

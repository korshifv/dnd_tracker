name: Cross-platform CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.4'

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade aqtinstall

      - name: Install Qt
        run: |
          aqt install-qt linux desktop "$QT_VERSION" gcc_64 --outputdir "$RUNNER_TEMP/Qt"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"

      - name: Build
        run: cmake --build build --parallel

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          choco install ninja --no-progress -y

      - name: Install Qt
        shell: pwsh
        run: |
          aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\Qt"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64"

      - name: Build
        run: cmake --build build --parallel

  android:
    name: Android ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python -m pip install --upgrade aqtinstall

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018'

      - name: Install Qt host and Android kits
        run: |
          aqt install-qt linux desktop "$QT_VERSION" gcc_64 --outputdir "$RUNNER_TEMP/Qt"
          aqt install-qt linux android "$QT_VERSION" android_arm64_v8a --outputdir "$RUNNER_TEMP/Qt"

      - name: Configure
        run: |
          "$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a/bin/qt-cmake" \
            -S . -B build-android -G Ninja \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018" \
            -DANDROID_ABI=arm64-v8a

      - name: Build native code
        run: cmake --build build-android --parallel

      - name: Build APK
        run: cmake --build build-android --target apk --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd-tracker-android-arm64
          path: build-android/**/*.apk
          if-no-files-found: error

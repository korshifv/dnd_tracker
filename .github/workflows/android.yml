name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python for aqtinstall
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt 6.6.3 for Android
        run: |
          aqt install-qt linux android 6.6.3 android_arm64_v8a --outputdir ${{ runner.workspace }}/Qt

      - name: Configure CMake
        run: |
          mkdir build-android
          cd build-android
          ${{ runner.workspace }}/Qt/6.6.3/android_arm64_v8a/bin/qt-cmake .. \
            -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/Qt/6.6.3/android_arm64_v8a" \
            -DQT_HOST_PATH="/usr" \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23

      - name: Build C++ and APK
        run: |
          cd build-android
          cmake --build . --parallel $(nproc)
          cmake --build . --target apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnd_tracker-android-apk
          path: build-android/android-build/dnd_tracker.apk
